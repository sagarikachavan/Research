<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Mirai - PTT Evolution Graph</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.2/dist/vis-network.min.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.2/dist/dist/vis-network.min.css" crossorigin="anonymous" />
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f8f9fa; }
    header { padding: 14px 18px; background: white; border-bottom: 1px solid #d1d5db; }
    #network { height: calc(100vh - 78px); width: 100vw; background-color: #f8f9fa; border: 1px solid lightgray; }
    .legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; margin-top: 6px; }
    .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
  </style>
</head>
<body>
  <header>
    <strong>Mirai - PTT Evolution Graph (1 run(s), 5 row(s))</strong>
    <div class="legend">
      <span><span class="swatch" style="background:#3A86FF"></span>Agent (cumulative PTT state)</span>
      <span><span class="swatch" style="background:#FF006E"></span>Agent Goal</span>
      <span><span class="swatch" style="background:#FB5607"></span>Search (PTT item worked)</span>
      <span><span class="swatch" style="background:#06D6A0"></span>Track (findings)</span>
      <span>Black: StateTransition | Green: SearchUpdate | Blue: TrackUpdate | Purple: Prediction</span>
    </div>
  </header>
  <div id="network"></div>
  <script type="text/javascript">
    var nodes = new vis.DataSet([{"id": "agent:Mirai:START", "label": "Agent: Initial\n(Start)", "color": "#3A86FF", "shape": "dot", "size": 40, "borderColor": "#212529", "borderWidth": 3, "font": {"color": "#212529"}, "title": "Start of pentest against 'Mirai'. 1 recorded run(s) below."}, {"id": "search:Mirai:r1_s1_2.1", "label": "Search: 2.1\nService enumeration", "color": "#FB5607", "shape": "dot", "size": 40, "borderColor": "#212529", "borderWidth": 3, "font": {"color": "#212529"}, "title": "PTT item 2.1: Service enumeration\n\nMCP tool calls:\nNmap: Execute port scan with service version detection (-sV -sC) against target 10.10.10.48"}, {"id": "track:Mirai:r1_s1_2.1", "label": "Track: Service enumeration", "color": "#06D6A0", "shape": "dot", "size": 34, "borderColor": "#212529", "borderWidth": 3, "font": {"color": "#212529"}, "title": "2.1 Service enumeration:\n(status change only)"}, {"id": "agent:Mirai:r1_s1_2.1", "label": "Agent: 2.1\nEnumeration", "color": "#3A86FF", "shape": "dot", "size": 40, "borderColor": "#212529", "borderWidth": 3, "font": {"color": "#212529"}, "title": "Cumulative PTT after 2.1:\n\u2713 1 Reconnaissance\n\u2026 2 Enumeration\n  \u25cb 2.1 Service enumeration\n\u25cb 3 Initial Access\n\u25cb 4 Privilege Escalation"}, {"id": "search:Mirai:r1_s2_4.1", "label": "Search: 4.1\nPrivilege enumeration", "color": "#FB5607", "shape": "dot", "size": 40, "borderColor": "#212529", "borderWidth": 3, "font": {"color": "#212529"}, "title": "PTT item 4.1: Privilege enumeration\n\nMCP tool calls:\nInteractive CLI: Attempt SSH connection to 10.10.10.48 using credentials pi/raspberry via sshpass command"}, {"id": "track:Mirai:r1_s2_4.1", "label": "Track: Privilege enumeration", "color": "#06D6A0", "shape": "dot", "size": 34, "borderColor": "#212529", "borderWidth": 3, "font": {"color": "#212529"}, "title": "4.1 Privilege enumeration:\n(status change only)"}, {"id": "agent:Mirai:r1_s2_4.1", "label": "Agent: 4.1\nPrivilege Escalation", "color": "#3A86FF", "shape": "dot", "size": 40, "borderColor": "#212529", "borderWidth": 3, "font": {"color": "#212529"}, "title": "Cumulative PTT after 4.1:\n\u2713 1 Reconnaissance\n\u2713 2 Enumeration\n\u2713 3 Initial Access\n\u2026 4 Privilege Escalation\n  \u25cb 4.1 Privilege enumeration"}, {"id": "agent:Mirai:r1_close", "label": "Agent: Task\nComplete (Goal)", "color": "#FF006E", "shape": "dot", "size": 46, "borderColor": "#212529", "borderWidth": 3, "font": {"color": "#212529"}, "title": "Final cumulative PTT for this run:\n\u2713 1 Reconnaissance\n\u2713 2 Enumeration\n\u2713 3 Initial Access\n\u2713 4 Privilege Escalation"}]);
    var edges = new vis.DataSet([{"from": "agent:Mirai:START", "to": "agent:Mirai:r1_s1_2.1", "label": "\u2192 2.1", "color": "#000000", "width": 4, "arrows": "to", "smooth": {"type": "continuous"}, "title": "StateTransition"}, {"from": "agent:Mirai:START", "to": "search:Mirai:r1_s1_2.1", "label": "2.1 Service enumeration", "color": "#06D6A0", "width": 3, "arrows": "to", "smooth": {"type": "continuous"}, "title": "SearchUpdate"}, {"from": "search:Mirai:r1_s1_2.1", "to": "track:Mirai:r1_s1_2.1", "label": "Discover", "color": "#3A86FF", "width": 3, "arrows": "to", "smooth": {"type": "continuous"}, "title": "TrackUpdate"}, {"from": "track:Mirai:r1_s1_2.1", "to": "agent:Mirai:r1_s1_2.1", "label": "Leads to", "color": "#8338EC", "width": 2, "arrows": "to", "smooth": {"type": "continuous"}, "title": "Prediction"}, {"from": "agent:Mirai:r1_s1_2.1", "to": "agent:Mirai:r1_s2_4.1", "label": "\u2192 4.1", "color": "#000000", "width": 4, "arrows": "to", "smooth": {"type": "continuous"}, "title": "StateTransition"}, {"from": "agent:Mirai:r1_s1_2.1", "to": "search:Mirai:r1_s2_4.1", "label": "4.1 Privilege enumerati\u2026", "color": "#06D6A0", "width": 3, "arrows": "to", "smooth": {"type": "continuous"}, "title": "SearchUpdate"}, {"from": "search:Mirai:r1_s2_4.1", "to": "track:Mirai:r1_s2_4.1", "label": "Discover", "color": "#3A86FF", "width": 3, "arrows": "to", "smooth": {"type": "continuous"}, "title": "TrackUpdate"}, {"from": "track:Mirai:r1_s2_4.1", "to": "agent:Mirai:r1_s2_4.1", "label": "Leads to", "color": "#8338EC", "width": 2, "arrows": "to", "smooth": {"type": "continuous"}, "title": "Prediction"}, {"from": "agent:Mirai:r1_s2_4.1", "to": "agent:Mirai:r1_close", "label": "close", "color": "#000000", "width": 4, "arrows": "to", "smooth": {"type": "continuous"}, "title": "StateTransition"}]);
    var container = document.getElementById('network');
    var data = { nodes: nodes, edges: edges };
    var options = {
      physics: { forceAtlas2Based: { springLength: 340, springConstant: 0.02, centralGravity: 0.006, damping: 0.3, nodeDistance: 300 },
                  minVelocity: 0.75, solver: "forceAtlas2Based", stabilization: { iterations: 220 } },
      interaction: { hover: true, navigationButtons: true, keyboard: true },
      nodes: { font: { size: 13 } },
      edges: { font: { size: 9, color: '#212529', align: 'middle' }, smooth: { type: 'continuous' } }
    };
    new vis.Network(container, data, options);
  </script>
</body>
</html>
