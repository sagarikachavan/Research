<svg width="1100" height="1650" viewBox="0 0 1100 1650" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Phase 1 Supervised Warmup Corrected Diagram</title>
  <desc id="desc">Corrected Phase 1 supervised warmup diagram matching the current train_gnn_rl.py implementation.</desc>

  <rect width="1100" height="1650" fill="#f8fafc"/>

  <style>
    .title { font: 700 30px Arial, sans-serif; fill: #16365c; }
    .subtitle { font: italic 700 18px Arial, sans-serif; fill: #111827; }
    .section { font: 700 16px Arial, sans-serif; fill: #166534; }
    .headblue { font: 700 16px Arial, sans-serif; fill: #1d4ed8; }
    .headpurple { font: 700 16px Arial, sans-serif; fill: #5b21b6; }
    .body { font: 400 14px Arial, sans-serif; fill: #111827; }
    .small { font: 400 13px Arial, sans-serif; fill: #374151; }
    .step { font: 700 15px Arial, sans-serif; fill: #111827; }
    .formula { font: 400 15px 'Courier New', monospace; fill: #111827; }
    .tick { font: 700 18px Arial, sans-serif; fill: #15803d; }
  </style>

  <text x="550" y="55" text-anchor="middle" class="title">PHASE 1: SUPERVISED LEARNING (WARMUP)</text>
  <text x="550" y="90" text-anchor="middle" class="subtitle">One Training Sample (Graph + Step Pair)</text>

  <line x1="550" y1="105" x2="550" y2="130" stroke="#111827" stroke-width="3"/>
  <polygon points="550,140 544,128 556,128" fill="#111827"/>

  <rect x="80" y="140" width="940" height="170" rx="12" fill="#f0fdf4" stroke="#6aa56a" stroke-width="3"/>
  <text x="550" y="180" text-anchor="middle" class="section">Current Pentest State</text>
  <circle cx="140" cy="220" r="10" fill="#60a5fa" stroke="#4b5563" stroke-width="2"/>
  <circle cx="185" cy="185" r="10" fill="#fbbf24" stroke="#4b5563" stroke-width="2"/>
  <circle cx="225" cy="235" r="10" fill="#86efac" stroke="#4b5563" stroke-width="2"/>
  <circle cx="270" cy="195" r="10" fill="#c4b5fd" stroke="#4b5563" stroke-width="2"/>
  <circle cx="305" cy="250" r="10" fill="#60a5fa" stroke="#4b5563" stroke-width="2"/>
  <circle cx="140" cy="250" r="10" fill="#f87171" stroke="#4b5563" stroke-width="2"/>
  <line x1="140" y1="220" x2="185" y2="185" stroke="#4b5563" stroke-width="3"/>
  <line x1="140" y1="220" x2="225" y2="235" stroke="#4b5563" stroke-width="3"/>
  <line x1="140" y1="220" x2="140" y2="250" stroke="#4b5563" stroke-width="3"/>
  <line x1="185" y1="185" x2="270" y2="195" stroke="#4b5563" stroke-width="3"/>
  <line x1="225" y1="235" x2="270" y2="195" stroke="#4b5563" stroke-width="3"/>
  <line x1="225" y1="235" x2="305" y2="250" stroke="#4b5563" stroke-width="3"/>
  <line x1="270" y1="195" x2="305" y2="250" stroke="#4b5563" stroke-width="3"/>
  <text x="380" y="200" class="body">• Penetration Testing Graph</text>
  <text x="380" y="228" class="body">• Previous Strategy + Explanation</text>
  <text x="380" y="256" class="body">• Previous Step + Explanation</text>
  <text x="380" y="284" class="body">• Previous Result + Previous MCP Tasks</text>

  <line x1="550" y1="310" x2="550" y2="350" stroke="#111827" stroke-width="3"/>
  <line x1="550" y1="350" x2="280" y2="350" stroke="#111827" stroke-width="3"/>
  <line x1="550" y1="350" x2="820" y2="350" stroke="#111827" stroke-width="3"/>
  <line x1="280" y1="350" x2="280" y2="372" stroke="#111827" stroke-width="3"/>
  <line x1="820" y1="350" x2="820" y2="372" stroke="#111827" stroke-width="3"/>

  <rect x="35" y="372" width="430" height="120" rx="12" fill="#eff6ff" stroke="#7aa7d7" stroke-width="3"/>
  <text x="250" y="410" text-anchor="middle" class="headblue">GNN</text>
  <text x="250" y="440" text-anchor="middle" class="body">Encodes graph into graph vector</text>
  <text x="250" y="466" text-anchor="middle" class="small">Current code uses 2-layer GCN (not GAT)</text>

  <rect x="635" y="372" width="430" height="120" rx="12" fill="#eff6ff" stroke="#7aa7d7" stroke-width="3"/>
  <text x="850" y="410" text-anchor="middle" class="headblue">Sentence-BERT</text>
  <text x="850" y="440" text-anchor="middle" class="body">Encodes previous text context</text>
  <text x="850" y="466" text-anchor="middle" class="small">Model: all-MiniLM-L6-v2</text>

  <line x1="280" y1="492" x2="280" y2="520" stroke="#111827" stroke-width="3"/>
  <line x1="820" y1="492" x2="820" y2="520" stroke="#111827" stroke-width="3"/>
  <line x1="280" y1="520" x2="550" y2="520" stroke="#111827" stroke-width="3"/>
  <line x1="820" y1="520" x2="550" y2="520" stroke="#111827" stroke-width="3"/>
  <line x1="550" y1="520" x2="550" y2="545" stroke="#111827" stroke-width="3"/>
  <polygon points="550,555 544,543 556,543" fill="#111827"/>

  <rect x="150" y="555" width="800" height="54" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="3"/>
  <text x="550" y="589" text-anchor="middle" class="headpurple">Combine into Policy Vector</text>

  <line x1="550" y1="609" x2="550" y2="635" stroke="#111827" stroke-width="3"/>
  <polygon points="550,645 544,633 556,633" fill="#111827"/>

  <rect x="150" y="645" width="800" height="54" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="3"/>
  <text x="550" y="679" text-anchor="middle" class="headpurple">Replace [GRAPH] Token Embedding</text>

  <line x1="550" y1="699" x2="550" y2="725" stroke="#111827" stroke-width="3"/>
  <polygon points="550,735 544,723 556,723" fill="#111827"/>

  <rect x="120" y="735" width="860" height="95" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="3"/>
  <text x="550" y="770" text-anchor="middle" class="headpurple">GPT-2 Input</text>
  <text x="550" y="798" text-anchor="middle" class="body">Prompt (previous context) + correct full target answer</text>
  <text x="550" y="820" text-anchor="middle" class="small">Teacher forcing: the gold continuation is fed during supervised warmup</text>

  <line x1="550" y1="830" x2="550" y2="856" stroke="#111827" stroke-width="3"/>
  <polygon points="550,866 544,854 556,854" fill="#111827"/>

  <rect x="150" y="866" width="800" height="54" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="3"/>
  <text x="550" y="900" text-anchor="middle" class="headpurple">Mask Prompt Tokens (No Loss Here)</text>

  <line x1="550" y1="920" x2="550" y2="946" stroke="#111827" stroke-width="3"/>
  <polygon points="550,956 544,944 556,944" fill="#111827"/>

  <rect x="120" y="956" width="860" height="95" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="3"/>
  <text x="550" y="991" text-anchor="middle" class="headpurple">Compute Cross-Entropy Loss</text>
  <text x="550" y="1019" text-anchor="middle" class="body">Only on the target continuation tokens</text>
  <text x="550" y="1041" text-anchor="middle" class="small">Current Phase 1 learns the whole structured answer text, not separate Step/MCP heads</text>

  <line x1="550" y1="1051" x2="550" y2="1077" stroke="#111827" stroke-width="3"/>
  <polygon points="550,1087 544,1075 556,1075" fill="#111827"/>

  <rect x="150" y="1087" width="800" height="54" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="3"/>
  <text x="550" y="1121" text-anchor="middle" class="headpurple">Backpropagation &amp; Weight Update</text>

  <line x1="550" y1="1141" x2="550" y2="1167" stroke="#111827" stroke-width="3"/>
  <polygon points="550,1177 544,1165 556,1165" fill="#111827"/>

  <rect x="120" y="1177" width="860" height="54" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="3"/>
  <text x="550" y="1211" text-anchor="middle" class="headpurple">Update GNN + Projection/Combine Layers + GPT-2 Weights</text>

  <line x1="550" y1="1231" x2="550" y2="1257" stroke="#111827" stroke-width="3"/>
  <polygon points="550,1267 544,1255 556,1255" fill="#111827"/>

  <rect x="150" y="1267" width="800" height="54" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/>
  <text x="550" y="1301" text-anchor="middle" class="step">Repeat for Every Training Sample</text>

  <line x1="550" y1="1321" x2="550" y2="1347" stroke="#111827" stroke-width="3"/>
  <polygon points="550,1357 544,1345 556,1345" fill="#111827"/>

  <rect x="150" y="1357" width="800" height="54" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/>
  <text x="550" y="1391" text-anchor="middle" class="step">After 5 Supervised Epochs</text>

  <rect x="110" y="1435" width="880" height="135" rx="12" fill="#f0fdf4" stroke="#6aa56a" stroke-width="3"/>
  <text x="550" y="1472" text-anchor="middle" class="section">Model Learns</text>
  <text x="180" y="1510" class="tick">✓</text>
  <text x="210" y="1510" class="body">Correct output format for the full structured answer</text>
  <text x="180" y="1540" class="tick">✓</text>
  <text x="210" y="1540" class="body">How to use graph information together with previous text context</text>
  <text x="180" y="1570" class="tick">✓</text>
  <text x="210" y="1570" class="body">How to imitate the gold next pentesting answer under teacher forcing</text>

  <rect x="140" y="1595" width="820" height="38" rx="8" fill="#111827"/>
  <text x="550" y="1620" text-anchor="middle" style="font:700 16px Arial,sans-serif; fill:#ffffff;">Current Phase 1 uses LM loss on the gold continuation only; prompt tokens are masked out.</text>
</svg>
