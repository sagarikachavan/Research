 "#212529", "borderWidth": 3, "font": {"color": "#212529"}, "title": "PTT item 1.7.1: AS-REP Roasting Vulnerability Analysis\n\nMCP tool calls:\n- John-the-ripper: Crack the hash of the svc-alfresco account to obtain the original password."}, {"id": "track:forest:r1_s6_1.7.1", "label": "Track: Kerberos preauthentication is\u2026", "color": "#06D6A0", "shape": "dot", "size": 34, "borderColor": "#212529", "borderWidth": 3, "font": {"color": "#212529"}, "title": "1.7.1 AS-REP Roasting Vulnerability Analysis:\nKerberos preauthentication is a security feature in Microsoft's Active Directory that protects user accounts from offline password cracking attacks. It requires the client to demonstrate knowledge of their password before a Ticket Granting Ticket (TGT) is issued. AS-REP Roasting is a technique exploited when the \"Do not require Kerberos preauthentication\" option is enabled for a user account. The steps involved in AS-REP Roasting include identification of vulnerable accounts, requesting AS-REP, hash extraction, and offline cracking. The impact of AS-REP Roasting can lead to unauthorized access, privilege escalation, lateral movement, and data exfiltration. Reasons for disabling preauthentication often relate to compatibility with older Kerberos versions, specific applications or services not supporting Kerberos preauthentication, or troubleshooting account lockout issues. However, it significantly weakens the security posture of the account. Mitigation strategies include enabling Kerberos preauthentication for all user accounts, implementing strong password policies, monitoring for suspicious activity, regular audits and security assessments, addressing underlying issues for disabling preauthentication, and staying updated with Microsoft's security updates. Tools like Mimikatz, Impacket, Rubeus, Hashcat, John the Ripper, and Purple Knight can be used in the process of exploiting or mitigating this vulnerability. Relevant Event IDs for monitoring include 4768 (Kerberos authentication ticket request), 4738 (change in user account's properties), and 4104 (use of cmdlets disabling Kerberos preauthentication)."}, {"id": "agent:forest:r1_s6_1.7.1", "label": "Agent: 1.7.1\nKerberos Preauthentic\u2026", "color": "#3A86FF", "shape": "dot", "size": 40, "borderColor": "#212529", "borderWidth": 3, "font": {"color": "#212529"}, "title": "Cumulative PTT after 1.7.1:\n\u2713 1 Reconnaissance\n  \u2713 1.1 Passive Information Gathering\n  \u2713 1.2 Active Information Gathering\n  \u2713 1.3 Identify Open Ports, Services running on the open ports and their versions\n    \u2713 1.3.1 Perform a port scan\n    \u2713 1.3.2 Determine the services and versions on each open port\n      \u2713 1.3.2.1 IP: 10.129.95.210\n  \u2713 1.4 DNS Enumeration\n    \u2713 1.4.1 Resolve htb.local\n    \u2713 1.4.2 Resolve forest.htb.local\n  \u2713 1.5 SMB Enumeration\n    \u2713 1.5.1 SMB Mapping\n    \u2713 1.5.2 SMB Client\n  \u2713 1.6 RPC Enumeration\n    \u2713 1.6.1 Enumerate Domain Users\n    \u2713 1.6.2 Enumerate Domain Groups\n    \u2713 1.6.3 Enumerate Domain Admins Group\n    \u2713 1.6.4 Enumerate Administrator Account Details\n  \u2713 1.7 Kerberos Preauthentication Check\n    \u2713 1.7.1 AS-REP Roasting Vulnerability Analysis\n    \u2713 1.7.2 Security Testing Tool Analysis\n    \u2713 1.7.3 Impacket Tool GetNPUsers.py\n\u2026 2 Exploitation\n  \u2713 2.1 Crack the Hash\n\u25cb 3 Post-Exploitation"}, {"id": "search:forest:r1_s6_1.7.2", "label": "Search: 1.7.2\nSecurity Testing Tool Ana\u2026", "color": "#FB5607", "shape": "dot", "size": 40, "borderColor": "#212529", "borderWidth": 3, "font": {"color": "#212529"}, "title": "PTT item 1.7.2: Security Testing Tool Analysis\n\nMCP tool calls:\n- John-the-ripper: Crack the hash of the svc-alfresco account to obtain the original password."}, {"id": "track:forest:r1_s6_1.7.2", "label": "Track: Elastic Security Solution, Sp\u2026", "color": "#06D6A0", "shape": "dot", "size": 34, "borderColor": "#2125
