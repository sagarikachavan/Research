<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>jupiter - PTT Evolution Graph</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.2/dist/vis-network.min.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.2/dist/dist/vis-network.min.css" crossorigin="anonymous" />
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f8f9fa; }
    header { padding: 14px 18px; background: white; border-bottom: 1px solid #d1d5db; }
    #network { height: calc(100vh - 78px); width: 100vw; background-color: #f8f9fa; border: 1px solid lightgray; }
    .legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; margin-top: 6px; }
    .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
  </style>
</head>
<body>
  <header>
    <strong>jupiter - PTT Evolution Graph (1 run(s), 10 row(s))</strong>
    <div class="legend">
      <span><span class="swatch" style="background:#3A86FF"></span>Agent (cumulative PTT state)</span>
      <span><span class="swatch" style="background:#FF006E"></span>Agent Goal</span>
      <span><span class="swatch" style="background:#FB5607"></span>Search (PTT item worked)</span>
      <span><span class="swatch" style="background:#06D6A0"></span>Track (findings)</span>
      <span>Black: StateTransition | Green: SearchUpdate | Blue: TrackUpdate | Purple: Prediction</span>
    </div>
  </header>
  <div id="network"></div>
  <script type="text/javascript">
    var nodes = new vis.DataSet([{"id": "agent:jupiter:START", "label": "Agent: Initial\n(Start)", "color": "#3A86FF", "shape": "dot", "size": 40, "borderColor": "#212529", "borderWidth": 3, "font": {"color": "#212529"}, "title": "Start of pentest against 'jupiter'. 1 recorded run(s) below."}, {"id": "search:jupiter:r1_base", "label": "Search: Baseline\n(1 item(s))", "color": "#FB5607", "shape": "dot", "size": 40, "borderColor": "#212529", "borderWidth": 3, "font": {"color": "#212529"}, "title": "Baseline recon already completed before this run's first tracked step:\n1.3 Identify Open Ports, Services running on the open ports and their versions"}, {"id": "track:jupiter:r1_base", "label": "Track: Identify Open Ports, Serv\u2026", "color": "#06D6A0", "shape": "dot", "size": 34, "borderColor": "#212529", "borderWidth": 3, "font": {"color": "#212529"}, "title": "1.3 Identify Open Ports, Services running on the open ports and their versions: 1.3.1 Perform a port scan - {Findings: Host is up (0.13s latency). Open Ports: 22/tcp: Open, Service: SSH, Version: OpenSSH 8.9p1 Ubuntu 3ubuntu0.1; 80/tcp: Open, Service: HTTP, Version: nginx 1.18.0 (Ubuntu), HTTP Title: Did not follow redirect to http://jupiter.htb/, HTTP Server Header: nginx/1.18.0 (Ubuntu); Filtered Ports: 1477/tcp: Filtered, Service: capioverlan. Operating System: Linux, CPE: cpe:/o:linux:linux_kernel.}\n       1.3.2 Determine the services and versions on each open port - {Findings: 22/tcp: Open, Service: SSH, Version: OpenSSH 8.9p1 Ubuntu 3ubuntu0.1; 80/tcp: Open, Service: HTTP, Version: nginx 1.18.0 (Ubuntu).}\n   1.4 Target IP - 10.10.11.216"}, {"id": "agent:jupiter:r1_base", "label": "Agent: Baseline\nReconnaissance", "color": "#3A86FF", "shape": "dot", "size": 40, "borderColor": "#212529", "borderWidth": 3, "font": {"color": "#212529"}, "title": "Cumulative PTT so far:\n\u25cb 1 Reconnaissance\n  \u2713 1.1 Passive Information Gathering\n  \u2713 1.2 Active Information Gathering\n  \u2713 1.3 Identify Open Ports, Services running on the open ports and their versions"}, {"id": "agent:jupiter:r1_close", "label": "Agent: Run End\n(no further PTT growth)", "color": "#3A86FF", "shape": "dot", "size": 46, "borderColor": "#212529", "borderWidth": 3, "font": {"color": "#212529"}, "title": "Final cumulative PTT for this run:\n\u25cb 1 Reconnaissance\n  \u2713 1.1 Passive Information Gathering\n  \u2713 1.2 Active Information Gathering\n  \u2713 1.3 Identify Open Ports, Services running on the open ports and their versions"}]);
    var edges = new vis.DataSet([{"from": "agent:jupiter:START", "to": "agent:jupiter:r1_base", "label": "baseline", "color": "#000000", "width": 4, "arrows": "to", "smooth": {"type": "continuous"}, "title": "StateTransition"}, {"from": "agent:jupiter:START", "to": "search:jupiter:r1_base", "label": "Baseline Recon", "color": "#06D6A0", "width": 3, "arrows": "to", "smooth": {"type": "continuous"}, "title": "SearchUpdate"}, {"from": "search:jupiter:r1_base", "to": "track:jupiter:r1_base", "label": "Discover", "color": "#3A86FF", "width": 3, "arrows": "to", "smooth": {"type": "continuous"}, "title": "TrackUpdate"}, {"from": "track:jupiter:r1_base", "to": "agent:jupiter:r1_base", "label": "Leads to", "color": "#8338EC", "width": 2, "arrows": "to", "smooth": {"type": "continuous"}, "title": "Prediction"}, {"from": "agent:jupiter:r1_base", "to": "agent:jupiter:r1_close", "label": "close", "color": "#000000", "width": 4, "arrows": "to", "smooth": {"type": "continuous"}, "title": "StateTransition"}]);
    var container = document.getElementById('network');
    var data = { nodes: nodes, edges: edges };
    var options = {
      physics: { forceAtlas2Based: { springLength: 340, springConstant: 0.02, centralGravity: 0.006, damping: 0.3, nodeDistance: 300 },
                  minVelocity: 0.75, solver: "forceAtlas2Based", stabilization: { iterations: 220 } },
      interaction: { hover: true, navigationButtons: true, keyboard: true },
      nodes: { font: { size: 13 } },
      edges: { font: { size: 9, color: '#212529', align: 'middle' }, smooth: { type: 'continuous' } }
    };
    new vis.Network(container, data, options);
  </script>
</body>
</html>
