<svg width="1800" height="2000" viewBox="0 0 1800 2000" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Current RL GRPO Training Flow in stepmodel</title>
  <desc id="desc">Infographic explaining the exact Phase 2 RL GRPO path currently implemented in train_gnn_rl.py.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1324"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#172036"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="accentB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#94a3b8"/>
    </marker>
    <style>
      .title { font: 700 44px Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 21px Arial, sans-serif; fill: #cbd5e1; }
      .section { font: 700 24px Arial, sans-serif; fill: #e2e8f0; }
      .body { font: 400 20px Arial, sans-serif; fill: #dbe4f0; }
      .small { font: 400 17px Arial, sans-serif; fill: #bfd0e5; }
      .mono { font: 400 19px 'Courier New', monospace; fill: #e5eefc; }
      .chip { font: 700 15px Arial, sans-serif; fill: #08111f; }
      .num { font: 700 24px Arial, sans-serif; fill: #08111f; }
      .formula { font: 400 21px 'Courier New', monospace; fill: #eaf2ff; }
      .formulaSmall { font: 400 18px 'Courier New', monospace; fill: #eaf2ff; }
      .muted { font: 400 16px Arial, sans-serif; fill: #94a3b8; }
    </style>
  </defs>

  <rect x="0" y="0" width="1800" height="2000" fill="url(#bg)"/>
  <rect x="40" y="40" width="1720" height="1920" rx="28" fill="none" stroke="#1e293b" stroke-width="2"/>

  <text x="90" y="115" class="title">Phase 2: What RL GRPO Is Actually Doing Right Now</text>
  <text x="90" y="155" class="subtitle">Faithful to the current file on disk: train_gnn_rl.py</text>

  <rect x="90" y="190" width="1620" height="120" rx="22" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <circle cx="145" cy="250" r="26" fill="url(#accentB)"/>
  <text x="137" y="258" class="num">!</text>
  <text x="190" y="236" class="section">Key Clarification</text>
  <text x="190" y="268" class="body">This is generation-level GRPO, not tag-head GRPO. The model writes a full structured answer,</text>
  <text x="190" y="295" class="body">then reward is computed from how similar that text is to the gold answer.</text>

  <rect x="90" y="345" width="520" height="250" rx="24" fill="url(#panel)" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <text x="120" y="390" class="section">Models Used</text>
  <rect x="120" y="415" width="130" height="34" rx="17" fill="#38bdf8"/>
  <text x="161" y="438" class="chip">GRAPH</text>
  <text x="120" y="480" class="body">GNN: GCNConv-based graph encoder</text>
  <text x="120" y="512" class="small">Reason: use_gat = false in config.json</text>
  <rect x="120" y="535" width="180" height="34" rx="17" fill="#22c55e"/>
  <text x="153" y="558" class="chip">TEXT CONTEXT</text>
  <text x="120" y="592" class="body">Sentence-BERT: all-MiniLM-L6-v2</text>

  <rect x="650" y="345" width="1060" height="250" rx="24" fill="url(#panel)" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <text x="680" y="390" class="section">What The Policy Produces</text>
  <text x="680" y="432" class="body">It does not output separate Step and MCP class logits.</text>
  <text x="680" y="468" class="body">Instead it produces one fused conditioning vector h, which replaces the [GRAPH] token embedding in the LLM prompt.</text>
  <text x="680" y="525" class="formula">h = Combine( GNN(graph), Proj( SBERT(previous_text) ) )</text>
  <text x="680" y="565" class="small">Then the LLM generates full text: Strategy, Strategy Explanation, Step, Step Explanation, MCP Tasks</text>

  <g transform="translate(90,640)">
    <rect x="0" y="0" width="1620" height="1170" rx="30" fill="none" stroke="#233044" stroke-width="2"/>

    <line x1="810" y1="108" x2="810" y2="1140" stroke="#475569" stroke-width="5" marker-end="url(#arrow)"/>

    <g transform="translate(50,30)">
      <circle cx="28" cy="30" r="22" fill="url(#accentA)"/>
      <text x="21" y="38" class="num">1</text>
      <rect x="70" y="0" width="640" height="140" rx="24" fill="url(#panel)" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
      <text x="100" y="40" class="section">Build Input State</text>
      <text x="100" y="78" class="body">Take one training sample: graph nodes + edges + previous pentest context.</text>
      <text x="100" y="112" class="small">Prompt asks model to generate the next structured answer block.</text>
    </g>

    <g transform="translate(900,30)">
      <circle cx="28" cy="30" r="22" fill="url(#accentA)"/>
      <text x="21" y="38" class="num">2</text>
      <rect x="70" y="0" width="600" height="140" rx="24" fill="url(#panel)" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
      <text x="100" y="40" class="section">Encode Graph + Text</text>
      <text x="100" y="78" class="body">GCN reads node embeddings and edges. Sentence-BERT reads previous text.</text>
      <text x="100" y="112" class="formulaSmall">h = Combine(GNN(graph), Proj(SBERT(previous_text)))</text>
    </g>

    <g transform="translate(50,220)">
      <circle cx="28" cy="30" r="22" fill="url(#accentA)"/>
      <text x="21" y="38" class="num">3</text>
      <rect x="70" y="0" width="640" height="180" rx="24" fill="url(#panel)" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
      <text x="100" y="40" class="section">Inject h Into The Prompt</text>
      <text x="100" y="78" class="body">The vector h is inserted at the [GRAPH] token position before generation.</text>
      <text x="100" y="112" class="body">So the LLM is conditioned by graph state, not by a separate classifier head.</text>
      <text x="100" y="152" class="small">Current LLM in config: gpt2-large</text>
    </g>

    <g transform="translate(900,250)">
      <circle cx="28" cy="30" r="22" fill="url(#accentA)"/>
      <text x="21" y="38" class="num">4</text>
      <rect x="70" y="0" width="600" height="235" rx="24" fill="url(#panel)" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
      <text x="100" y="40" class="section">Sample 4 Rollouts</text>
      <text x="100" y="78" class="body">The model writes 4 different candidate continuations for the same prompt.</text>
      <text x="100" y="112" class="small">Current settings: do_sample = True, temperature = 0.8, top_p = 0.95</text>
      <text x="100" y="148" class="formulaSmall">y_g ~ pi_theta(. | prompt, h)</text>
      <text x="100" y="188" class="small">Each rollout is a generated token sequence, not a chosen class label.</text>
    </g>

    <g transform="translate(50,470)">
      <circle cx="28" cy="30" r="22" fill="url(#accentA)"/>
      <text x="21" y="38" class="num">5</text>
      <rect x="70" y="0" width="640" height="235" rx="24" fill="url(#panel)" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
      <text x="100" y="40" class="section">Store Old Log-Probability</text>
      <text x="100" y="78" class="body">For each sampled continuation, the code stores the total log-probability of the generated tokens.</text>
      <text x="100" y="132" class="formulaSmall">log pi_old(y_g | s) = sum_t log p(y_g,t | prompt, y_g,&lt;t, h)</text>
      <text x="100" y="190" class="small">This is taken from transition scores returned by LLM generation.</text>
    </g>

    <g transform="translate(900,560)">
      <circle cx="28" cy="30" r="22" fill="url(#accentA)"/>
      <text x="21" y="38" class="num">6</text>
      <rect x="70" y="0" width="600" height="240" rx="24" fill="url(#panel)" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
      <text x="100" y="40" class="section">Parse Generated Text</text>
      <text x="100" y="78" class="body">The code extracts text fields from the generated answer:</text>
      <text x="120" y="118" class="body">Strategy</text>
      <text x="120" y="148" class="body">Step</text>
      <text x="120" y="178" class="body">MCP Tasks</text>
      <text x="100" y="216" class="small">These parsed strings are later compared with the gold strings.</text>
    </g>

    <g transform="translate(50,790)">
      <circle cx="28" cy="30" r="22" fill="url(#accentB)"/>
      <text x="21" y="38" class="num">7</text>
      <rect x="70" y="0" width="1450" height="250" rx="24" fill="url(#panel)" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
      <text x="100" y="40" class="section">Compute Reward</text>
      <text x="100" y="78" class="body">Reward is based on similarity to the gold answer, not exact tag accuracy.</text>
      <text x="100" y="130" class="formula">R = 0.2 * StepTokenOverlap + 0.2 * MCPTokenOverlap + 0.3 * StepSemanticSim + 0.3 * MCPSemanticSim</text>
      <text x="100" y="175" class="small">Token overlap rewards shared words. Semantic similarity rewards meaning closeness using Sentence-BERT embeddings.</text>
      <text x="100" y="210" class="small">In plain English: the answer gets a higher score if it sounds closer to the correct answer in wording or meaning.</text>
    </g>

    <g transform="translate(50,1085)">
      <circle cx="28" cy="30" r="22" fill="url(#accentB)"/>
      <text x="21" y="38" class="num">8</text>
      <rect x="70" y="0" width="640" height="210" rx="24" fill="url(#panel)" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
      <text x="100" y="40" class="section">Normalize Rewards Into Advantages</text>
      <text x="100" y="90" class="formulaSmall">mu = mean(R_1 ... R_M)</text>
      <text x="100" y="122" class="formulaSmall">sigma = std(R_1 ... R_M)</text>
      <text x="100" y="154" class="formulaSmall">A_j = (R_j - mu) / (sigma + 1e-8)</text>
      <text x="100" y="188" class="small">Better-than-average rollouts get positive advantage. Worse ones get negative advantage.</text>
    </g>

    <g transform="translate(900,1085)">
      <circle cx="28" cy="30" r="22" fill="url(#accentB)"/>
      <text x="21" y="38" class="num">9</text>
      <rect x="70" y="0" width="600" height="210" rx="24" fill="url(#panel)" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
      <text x="100" y="40" class="section">Recompute New Log-Probability</text>
      <text x="100" y="84" class="body">The code rebuilds prompt + generated sequence and measures how likely the same continuation is now.</text>
      <text x="100" y="132" class="formulaSmall">log pi_new(y_j | s_j) = sum over generated tokens</text>
      <text x="100" y="174" class="small">Prompt tokens are masked out. Only continuation tokens count.</text>
    </g>

    <g transform="translate(50,1375)">
      <circle cx="28" cy="30" r="22" fill="url(#accentB)"/>
      <text x="17" y="38" class="num">10</text>
      <rect x="70" y="0" width="1450" height="250" rx="24" fill="url(#panel)" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
      <text x="100" y="40" class="section">Build GRPO / PPO-Style Clipped Loss</text>
      <text x="100" y="88" class="formulaSmall">r_j(theta) = exp( log pi_new(y_j|s_j) - log pi_old(y_j|s_j) )</text>
      <text x="100" y="132" class="formulaSmall">L_GRPO = (1/M) * sum_j -min( r_j * A_j, clip(r_j, 1 - 0.2, 1 + 0.2) * A_j )</text>
      <text x="100" y="184" class="small">Clipping stops one update from changing the policy too aggressively.</text>
      <text x="100" y="216" class="small">Important: in the current file, Phase 2 uses only this GRPO loss, not an extra supervised Step/MCP loss.</text>
    </g>

    <g transform="translate(50,1685)">
      <circle cx="28" cy="30" r="22" fill="url(#accentA)"/>
      <text x="17" y="38" class="num">11</text>
      <rect x="70" y="0" width="1450" height="115" rx="24" fill="url(#panel)" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
      <text x="100" y="40" class="section">Backpropagation And Update</text>
      <text x="100" y="78" class="formulaSmall">g_t = grad_theta L_GRPO  ->  clip_norm(g_t, 1.0)  ->  AdamW step  ->  scheduler step</text>
    </g>
  </g>

  <rect x="90" y="1840" width="1620" height="90" rx="24" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="120" y="1880" class="section">One-Sentence Summary</text>
  <text x="120" y="1913" class="body">Current RL in stepmodel learns by sampling several full-text answers, scoring each by similarity to the gold answer, then making higher-reward answers more likely using a clipped PPO/GRPO update.</text>
</svg>
