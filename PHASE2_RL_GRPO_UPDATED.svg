<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
  <defs>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #1f1f1f; }
      .section { font: 700 22px Arial, sans-serif; fill: #1f1f1f; }
      .boxTitle { font: 700 20px Arial, sans-serif; fill: #1f3b63; }
      .boxText { font: 17px Arial, sans-serif; fill: #222; }
      .small { font: 15px Arial, sans-serif; fill: #333; }
      .tiny { font: 14px Arial, sans-serif; fill: #333; }
      .note { font: 16px Arial, sans-serif; fill: #ffffff; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#222"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="750" y="44" text-anchor="middle" class="title">PHASE 2: RL GRPO FLOW (CURRENT LABEL-ONLY VERSION)</text>

  <rect x="1160" y="30" rx="10" ry="10" width="290" height="115" fill="#222631"/>
  <text x="1180" y="58" class="note">Reward = 0.45 StepExact</text>
  <text x="1180" y="82" class="note">+ 0.20 MCP Set-F1</text>
  <text x="1180" y="106" class="note">+ 0.10 MCP Recall</text>
  <text x="1180" y="130" class="note">+ 0.10 (StepExact x MCPF1)</text>
  <text x="1180" y="154" class="note">+ 0.15 BothExact</text>

  <rect x="40" y="90" rx="18" ry="18" width="580" height="810" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="2"/>
  <text x="330" y="124" text-anchor="middle" class="section">ROLLOUT BUILDING</text>

  <rect x="80" y="150" rx="14" ry="14" width="500" height="100" fill="#eef6ff" stroke="#7fa2cc" stroke-width="2.5"/>
  <text x="330" y="186" text-anchor="middle" class="boxTitle">1. Data Input</text>
  <text x="112" y="214" class="boxText">Training sample = graph + previous context + gold Step/MCP labels</text>
  <text x="112" y="238" class="small">Prompt style is compact; explanations are not used as targets</text>

  <line x1="330" y1="250" x2="330" y2="284" stroke="#222" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="80" y="300" rx="14" ry="14" width="500" height="114" fill="#eef6ff" stroke="#7fa2cc" stroke-width="2.5"/>
  <text x="330" y="336" text-anchor="middle" class="boxTitle">2. Context Encoding</text>
  <text x="110" y="364" class="boxText">GCN encodes graph state</text>
  <text x="110" y="388" class="boxText">Sentence-BERT encodes previous context</text>
  <text x="110" y="412" class="small">Fused state is linearly projected into K graph tokens</text>

  <line x1="330" y1="414" x2="330" y2="448" stroke="#222" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="80" y="464" rx="14" ry="14" width="500" height="104" fill="#f5edff" stroke="#b198db" stroke-width="2.5"/>
  <text x="330" y="500" text-anchor="middle" class="boxTitle">3. Prompt Injection + LLM Forward</text>
  <text x="104" y="528" class="boxText">Replace the first K [GRAPH] token embeddings with graph tokens</text>
  <text x="104" y="552" class="small">Run Qwen3-14B with LoRA and collect hidden states</text>

  <line x1="330" y1="568" x2="330" y2="602" stroke="#222" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="80" y="618" rx="14" ry="14" width="500" height="118" fill="#f5edff" stroke="#b198db" stroke-width="2.5"/>
  <text x="330" y="654" text-anchor="middle" class="boxTitle">4. Hybrid Readout + Label Heads</text>
  <text x="108" y="682" class="boxText">Hybrid pooling = first token + mean pooled hidden state</text>
  <text x="108" y="706" class="boxText">Step head -> categorical logits</text>
  <text x="108" y="730" class="boxText">MCP head -> Bernoulli logits for 11 tools</text>

  <line x1="330" y1="736" x2="330" y2="770" stroke="#222" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="80" y="786" rx="14" ry="14" width="500" height="86" fill="#edf8ee" stroke="#79b284" stroke-width="2.5"/>
  <text x="330" y="822" text-anchor="middle" class="boxTitle">5. Sample Rollouts</text>
  <text x="118" y="850" class="boxText">Sample Step from Categorical and MCP tool set from Bernoulli</text>

  <rect x="652" y="90" rx="18" ry="18" width="808" height="810" fill="#fcfcfc" stroke="#bbbbbb" stroke-width="2"/>
  <text x="1056" y="124" text-anchor="middle" class="section">GRPO UPDATE PHASE</text>

  <rect x="692" y="160" rx="14" ry="14" width="320" height="120" fill="#fff4ea" stroke="#d7a36a" stroke-width="2.5"/>
  <text x="852" y="196" text-anchor="middle" class="boxTitle">6. Save Old Log-Prob</text>
  <text x="718" y="224" class="boxText">For each sampled rollout:</text>
  <text x="718" y="248" class="small">log p_old(step action) + log p_old(MCP action)</text>

  <rect x="1040" y="160" rx="14" ry="14" width="360" height="120" fill="#fff4ea" stroke="#d7a36a" stroke-width="2.5"/>
  <text x="1220" y="196" text-anchor="middle" class="boxTitle">7. Score Each Rollout</text>
  <text x="1070" y="224" class="boxText">Compare sampled labels against gold Step/MCP</text>
  <text x="1070" y="248" class="small">No free-text parsing and no semantic answer matching</text>

  <line x1="1012" y1="220" x2="1040" y2="220" stroke="#222" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="860" y="320" rx="14" ry="14" width="400" height="126" fill="#eef6ff" stroke="#7fa2cc" stroke-width="2.5"/>
  <text x="1060" y="356" text-anchor="middle" class="boxTitle">8. Compute Batch Advantage</text>
  <text x="900" y="384" class="boxText">For rewards R_j in the rollout group:</text>
  <text x="900" y="410" class="small">mean_r = average(R_j)</text>
  <text x="900" y="434" class="small">A_j = (R_j - mean_r) / (std(R) + 1e-8)</text>

  <line x1="852" y1="280" x2="852" y2="320" stroke="#222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1220" y1="280" x2="1220" y2="320" stroke="#222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="852" y1="320" x2="860" y2="320" stroke="#222" stroke-width="2.5"/>
  <line x1="1220" y1="320" x2="1260" y2="320" stroke="#222" stroke-width="2.5"/>

  <line x1="1060" y1="446" x2="1060" y2="486" stroke="#222" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="740" y="502" rx="14" ry="14" width="640" height="128" fill="#eef9ef" stroke="#78b280" stroke-width="2.5"/>
  <text x="1060" y="538" text-anchor="middle" class="boxTitle">9. Recompute Current Log-Prob</text>
  <text x="780" y="566" class="boxText">Run the same GCN + graph-token + Qwen path again</text>
  <text x="780" y="590" class="boxText">Get new Step/MCP logits and compute log p_new for the sampled action</text>
  <text x="780" y="614" class="small">This uses the updated current policy parameters</text>

  <line x1="1060" y1="630" x2="1060" y2="670" stroke="#222" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="770" y="686" rx="14" ry="14" width="580" height="108" fill="#f5edff" stroke="#b198db" stroke-width="2.5"/>
  <text x="1060" y="722" text-anchor="middle" class="boxTitle">10. Compute GRPO Loss + Aux Supervised Loss</text>
  <text x="808" y="750" class="boxText">ratio = exp(log p_new - log p_old)</text>
  <text x="808" y="774" class="small">L_total = L_GRPO + 0.1 x (1.5 Step CE + 1.5 MCP BCE)</text>

  <line x1="1060" y1="794" x2="1060" y2="834" stroke="#222" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="770" y="850" rx="14" ry="14" width="580" height="86" fill="#ffeef0" stroke="#d9989d" stroke-width="2.5"/>
  <text x="1060" y="886" text-anchor="middle" class="boxTitle">11. Backpropagation and Update</text>
  <text x="1060" y="914" text-anchor="middle" class="boxText">Update GCN + token projector + classifier heads + trainable Qwen LoRA weights</text>

  <path d="M580 828 C650 828, 650 566, 740 566" stroke="#222" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M580 828 C670 828, 670 220, 692 220" stroke="#222" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
</svg>
